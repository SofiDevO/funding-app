      <stop offset="0" stop-color="#4a2410"/>
      <stop offset="1" stop-color="#1a0d07"/>
    </linearGradient>
    <radialGradient id="chocolate-glow" cx="0.5" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#aa68df" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#aa68df" stop-opacity="0"/>
